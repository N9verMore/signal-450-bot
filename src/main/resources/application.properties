#######################################################################
# App
#######################################################################
spring.application.name=bot-450
server.port=8080

#######################################################################
# Signal API (?????? docker-???? ? ????????? signal-api:8080)
#######################################################################
org.atics.bot450.message=${SIGNAL_MESSAGE}
org.atics.bot450.cron.time=${CRON_TIME}
org.atics.signal.api.url=${SIGNAL_API_URL:http://signal-api:8080}
org.atics.signal.group.name=${SIGNAL_GROUP_NAME}
org.atics.signal.sender.number=${SIGNAL_SENDER_NUMBER}

# === OAuth2 Client (Keycloak) ===
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:admin-cli}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
# ?? ????????? Spring: {baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bot-realm}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# (?????????????, ?? ??????? ?? ??????/?????????)
server.forward-headers-strategy=native

#######################################################################
# Keycloak Admin API (???????????/?????????? ???????) ????? ?????/??????
# ??? ?? ?? ?????????? service account ? ?? ?????? ??????????
# ??? ???????? ?????? ???? KeycloakUserService
#######################################################################
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://keycloak:8080}
keycloak.realm=${KEYCLOAK_REALM:bot-realm}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

