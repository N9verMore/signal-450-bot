#######################################################################
# App
#######################################################################
spring.application.name=bot-450
server.port=8080

#######################################################################
# Signal API (?????? docker-???? ? ????????? signal-api:8080)
#######################################################################
org.atics.bot450.message=${SIGNAL_MESSAGE}
org.atics.bot450.cron.time=${CRON_TIME}
org.atics.signal.api.url=${SIGNAL_API_URL:http://signal-api:8080}
org.atics.signal.group.name=${SIGNAL_GROUP_NAME}
org.atics.signal.sender.number=${SIGNAL_SENDER_NUMBER}

# === OAuth2 Client (Keycloak) ===
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:bot-client}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:bot-client-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
# OAuth2 redirect from Keycloak back to this app
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Provider configuration
# Use issuer-uri for metadata discovery (inside Docker network), but override authorization-uri to a browser-resolvable host
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/bot-realm}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTH_URI:http://localhost:8081/realms/bot-realm/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/bot-realm/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/bot-realm/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_USERINFO_URI:http://keycloak:8080/realms/bot-realm/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# (?????????????, ?? ??????? ?? ??????/?????????)
server.forward-headers-strategy=native

