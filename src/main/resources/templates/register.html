<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout (~{::title}, ~{::link}, ~{::header},  ~{::main},  ~{::scripts})">
<head>
    <title>Registration</title>
    <link rel="stylesheet" href="/css/register.css"/>
</head>
<body>
<header th:fragment="headerTitle">
    <span>Registration</span>
</header>
<main th:fragment="content">
    <div class="form">
        <div class="card">
            <h2>Create account</h2>
            <div th:if="${error}" class="error" th:text="${error}">User already exists</div>
            <form th:action="@{/register}" method="post">
                <div class="form-row">
                    <div class="field">
                        <label class="label">Phone number (username)</label>
                        <input class="input" type="text" name="mobileNumber" th:value="${mobileNumber}" required/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label class="label">Password</label>
                        <input class="input" type="password" name="password" required/>
                    </div>
                    <div class="field">
                        <label class="label">Confirm password</label>
                        <input class="input" type="password" name="password2" required/>
                    </div>
                </div>
                <!-- если включите CSRF -->
                <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->
                <div style="display:flex; gap:10px; margin-top:12px">
                    <button class="btn" type="submit">Sign up</button>
                    <a class="btn secondary" href="/login">Back</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
