<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout (~{::title}, ~{::link}, ~{::body/header}, ~{::main},  ~{::scripts} )">
<head>
    <title>Scheduler</title>
    <link rel="stylesheet" href="/css/scheduler.css"/>
</head>
<body>
<header th:fragment="headerTitle">
    <span>Message Scheduler</span>
</header>
<main th:fragment="content">
    <div class="grid">
        <div class="card">
            <form th:action="@{/schedule}" method="post">
                <div class="form-row">
                    <div class="field">
                        <label class="label">Group</label>
                        <select class="input" name="groupId" required>
                            <option value="" disabled selected>Select a group…</option>
                            <option th:each="g : ${groups}"
                                    th:value="${g.id}"
                                    th:text="${g.name} ?: ${g.id}">Group</option>
                        </select>
                    </div>
                </div>

                <div class="form-row full">
                    <div class="field">
                        <label class="label">Message</label>
                        <textarea class="input" name="message" rows="5" placeholder="Text to be sent to Signal..." required></textarea>
                    </div>
                </div>

                <div class="form-row full">
                    <div class="field">
                        <label class="label">Send time(s)</label>
                        <div id="time-list" class="time-list">
                            <div class="time-item" style="display:flex; gap:8px; align-items:center; margin-bottom:8px">
                                <input class="input" type="datetime-local" name="times" required>
                                <button type="button" class="btn danger" onclick="removeRow(this)">×</button>
                            </div>
                        </div>
                        <div style="margin-top:10px">
                            <button id="add-time" type="button" class="btn secondary">+ Add time</button>
                        </div>
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-top:16px">
                    <button class="btn" type="submit">Schedule</button>
                    <a class="btn secondary" href="/tasks">Back to tasks</a>
                </div>
            </form>
        </div>

        <div class="card">
            <h3 style="margin-top:0">Tips</h3>
            <p class="label">You can add several future date-times.</p>
            <p class="label">Messages will be sent from <strong>your linked number</strong> to the selected group.</p>
        </div>
    </div>
</main>

<th:block th:fragment="scripts">
    <script>
        function removeRow(btn) {
            const row = btn.closest('.time-item');
            const list = document.getElementById('time-list');
            if (list.querySelectorAll('.time-item').length > 1) {
                row.remove();
            }
        }
        document.getElementById('add-time').addEventListener('click', () => {
            const list = document.getElementById('time-list');
            const div = document.createElement('div');
            div.className = 'time-item';
            div.style.cssText = 'display:flex; gap:8px; align-items:center; margin-bottom:8px';
            div.innerHTML = `
            <input class="input" type="datetime-local" name="times" required>
            <button type="button" class="btn danger" onclick="removeRow(this)">×</button>`;
            list.appendChild(div);
        });
    </script>
</th:block>
</body>
</html>
