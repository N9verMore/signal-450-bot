services:
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    container_name: signal-api
    restart: unless-stopped
    environment:
      - MODE=native
    volumes:
      - ./signal-cli-data:/home/.local/share/signal-cli
    networks:
      - bot-network
    # НЕ пробрасываем порты наружу - signal-api доступен только внутри Docker сети!

  bot-450:
    build: .
    container_name: bot-450
    ports:
      - "8080:8080"  # Только bot-450 доступен снаружи
    depends_on:
      - signal-api
    env_file:
      - .env
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
